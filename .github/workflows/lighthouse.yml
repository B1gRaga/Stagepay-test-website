# Lighthouse scores for the public pages (landing, sign in, sign up) on a
# production build. Accessibility under 90 fails; performance, best practices
# and SEO only warn. Each run posts a link to the full reports in the log.
# Needs the same Supabase secrets as the e2e job in ci.yml.
name: Lighthouse

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - name: Skip until the Supabase secrets are set
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: echo "::notice::Lighthouse skipped — add the Supabase repository secrets to run it."
      - uses: actions/checkout@v4
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
      - uses: actions/setup-node@v4
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
      - run: npm run build
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
      - run: npx lhci autorun
        if: env.NEXT_PUBLIC_SUPABASE_URL != ''
