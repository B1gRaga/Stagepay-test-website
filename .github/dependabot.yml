# Dependabot opens pull requests when packages have updates or security fixes.
# Small updates are grouped into one weekly pull request; major versions come
# separately so they can be checked on their own. CI runs on each one.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    ignore:
      # The PDF preview uses a worker and fonts copied into public/pdfjs-<version>,
      # so a major upgrade means re-copying those files and updating the code.
      - dependency-name: pdfjs-dist
        update-types: [version-update:semver-major]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
